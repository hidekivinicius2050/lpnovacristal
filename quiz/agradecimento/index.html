<style>
:root{
  --accent:#01083E;
  --accent-dark:#000426;
  --accent-soft:#E5E8F3;
  --accent-softer:#F4F5FA;
  --accent-line:#B8C0DE;
  --ink:#1c1d26;
  --muted:#6b6c78;
  --border:#ebe9e4;
  --wa1:#25D366;
  --wa2:#128C4B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
body.has-wa{padding-bottom:120px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.wrap{position:relative;z-index:2;width:100%;max-width:640px;margin:0 auto;padding:28px 20px 30px}

.card{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 28px rgba(20,20,50,.06);padding:24px 22px;margin-bottom:16px}
.in{opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.22,1,.36,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

.chip{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:99px;margin-bottom:12px}
.chip svg{width:14px;height:14px;flex:0 0 14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fase{font-size:24px;font-weight:700;color:var(--accent);line-height:1.25;margin-bottom:8px}
.desc{color:var(--muted);font-size:14.5px;line-height:1.6}

.hello{text-align:center;padding:10px 6px 18px}
.hello h1{font-size:28px;font-weight:800;color:var(--accent-dark);line-height:1.2;margin-bottom:10px}
.hello p{font-size:15.5px;line-height:1.6;color:var(--ink);max-width:520px;margin:0 auto}
.hello p strong{color:var(--accent)}

.spec{display:flex;align-items:center;gap:14px;background:var(--accent-softer);border:1px solid var(--accent-soft);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.spec .ic{flex:0 0 46px;height:46px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
.spec .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.spec p{font-size:14.5px;line-height:1.5;font-weight:500}

.card h3{font-size:17px;font-weight:700;color:var(--accent-dark);margin-bottom:14px}
.list{list-style:none;display:flex;flex-direction:column;gap:11px;margin-bottom:18px}
.list li{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;line-height:1.5}
.list li svg{flex:0 0 22px;width:22px;height:22px;margin-top:1px}
.hl{background:linear-gradient(135deg,var(--accent-softer),var(--accent-soft));border:1px solid var(--accent-line);border-radius:16px;padding:18px;text-align:center}
.hl small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:4px}
.hl strong{display:block;font-size:30px;font-weight:800;color:var(--accent);line-height:1.15}
.hl span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}

.next{text-align:center}
.pill{display:inline-block;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.08em;padding:6px 14px;border-radius:99px;margin-bottom:12px}
.next h3{margin-bottom:8px}
.next p{font-size:14.5px;line-height:1.55;color:var(--muted)}
.next .free{color:var(--accent);font-weight:600;margin-top:10px}

.logo{text-align:center;padding:12px 0 6px}
.logo img{height:30px;width:auto;opacity:.55}

/* Botão fixo do WhatsApp */
.wa-bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:30px 20px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(0,4,38,.55),rgba(0,4,38,0))}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;max-width:600px;margin:0 auto;height:58px;border-radius:16px;color:#fff;text-decoration:none;font:600 16px 'Poppins',sans-serif;background:linear-gradient(135deg,var(--wa1),var(--wa2));box-shadow:0 10px 28px rgba(37,211,102,.45);animation:glow 2.2s ease-in-out infinite}
.wa-btn.loading{pointer-events:none;opacity:.85;animation:none}
.wa-btn svg{width:22px;height:22px;flex:0 0 22px;fill:#fff}
.wa-btn .sp{width:18px;height:18px;flex:0 0 18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 10px 28px rgba(37,211,102,.40)}50%{box-shadow:0 10px 38px rgba(37,211,102,.75)}}

@media (max-width:380px){.hello h1{font-size:24px}.fase{font-size:21px}.hl strong{font-size:26px}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}.wa-btn{animation:none}}
</style>
</head>

<script>
/* =====================================================================
   CONFIGURAÇÃO — Agradecimento Cristal Consórcio

/* WhatsApp do especialista (só dígitos, com DDI). Vazio = botão fixo não aparece */
const WHATSAPP_NUMBER = '';
const WHATSAPP_MSG = 'Olá! Sou {nome}, acabei de responder o quiz e quero conhecer a estratégia ideal pro meu perfil.';

/* Textos variáveis — ⚠️ provisório (padrão da Documentação adaptado à Cristal; aguardando aprovação do cliente) */
const TXT = {
  fase:  'Fase de Estratégia',                                                                     /* ⚠️ provisório */
  desc:  'Você já sabe onde quer chegar. Agora é hora de montar o plano certo para conquistar seu objetivo sem juros e com segurança.', /* ⚠️ provisório */
  hello: 'Parabéns, {nome}!',
  helloSemNome: 'Parabéns!',
  pot:   'Seu perfil mostra potencial para usar o consórcio de um jeito <strong>diferente de 99% das pessoas</strong> — com estratégia, assessoria e <strong>sem juros</strong>.', /* ⚠️ provisório */
  spec:  'Um dos nossos consultores vai te chamar no WhatsApp em instantes para apresentar a estratégia ideal pro seu perfil.',
  lista: [                                                                                          /* ⚠️ provisório */
    'Conquistar seu imóvel ou veículo sem os juros do financiamento',
    'Planejar a contemplação com estratégia de lance',
    'Usar a carta de crédito para alavancar seu patrimônio',
    'Ter assessoria do início até a contemplação'
  ],
  hlLabel: 'Juros pagos no consórcio',                                                              /* ⚠️ provisório */
  hlValue: 'R$ 0',                                                                                  /* ⚠️ provisório */
  hlNote:  'Apenas taxa de administração, diluída nas parcelas',                                    /* ⚠️ provisório */
  next:  'Nosso time vai entrar em contato pelo WhatsApp que você informou para montar sua estratégia personalizada.'
};
/* ===================== FIM DA CONFIGURAÇÃO ===================== */

(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* Nome via ?nome= */
  let nome = '';
  try { nome = (new URLSearchParams(location.search).get('nome') || '').trim().split(/\s+/)[0] || ''; } catch (e) {}
  nome = nome.slice(0, 40);

  $('tFase').textContent = TXT.fase;
  $('tDesc').textContent = TXT.desc;
  $('tHello').textContent = nome ? TXT.hello.replace('{nome}', nome) : TXT.helloSemNome;
  $('tPot').innerHTML = TXT.pot;
  $('tSpec').textContent = TXT.spec;
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#01083E"/><path d="m7 12.5 3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  $('tList').innerHTML = TXT.lista.map(t => '<li>' + CHECK + '<span>' + esc(t) + '</span></li>').join('');
  $('tHlLabel').textContent = TXT.hlLabel;
  $('tHlValue').textContent = TXT.hlValue;
  $('tHlNote').textContent = TXT.hlNote;
  $('tNext').textContent = TXT.next;

  /* GTM */
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'quiz_lead_agradecimento' });

  /* Botão fixo do WhatsApp (só com número configurado) */
  const num = String(WHATSAPP_NUMBER).replace(/\D/g, '');
  if (num) {
    const bar = $('waBar'); bar.hidden = false; bar.classList.remove('hidden');
    document.body.classList.add('has-wa');
    const WA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2z"/></svg>';
    setTimeout(() => {
      const a = $('waBtn');
      a.href = 'https://wa.me/' + num + '?text=' + encodeURIComponent(nome ? WHATSAPP_MSG.replace('{nome}', nome) : WHATSAPP_MSG.replace(' Sou {nome},', ''));
      a.classList.remove('loading');
      a.innerHTML = WA_ICON + '<span>Falar com Especialista Agora</span>';
    }, 1800);
  }

  /* Som de entrada — acorde C5-E5-G5-C6 (WebAudio) */
  let played = false;
  function chord(){
    if (played) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ctx = new AC();
      const go = () => {
        if (ctx.state !== 'running') return false;
        played = true;
        const t0 = ctx.currentTime, master = ctx.createGain();
        master.gain.value = 0.14; master.connect(ctx.destination);
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + i * 0.09;
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.5, t + 0.03); g.gain.exponentialRampToValueAtTime(0.001, t + 1.3);
          o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.4);
        });
        return true;
      };
      if (!go() && ctx.resume) ctx.resume().then(go).catch(() => {});
    } catch (e) {}
  }
  chord();
  const unlock = () => { chord(); if (played) ['pointerdown','touchstart','scroll','keydown'].forEach(ev => window.removeEventListener(ev, unlock)); };
  ['pointerdown','touchstart','scroll','keydown'].forEach(ev => window.addEventListener(ev, unlock, { passive: true }));

  /* Confetes — canvas próprio */
  const cv = $('confetti');
  const ctx = cv.getContext ? cv.getContext('2d') : null;
  if (!ctx) return;
  const COLORS = ['#01083E', '#2A3C8F', '#4A5FBF', '#8FA2E8', '#C9D2F5', '#D4AF37'];
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size(){ W = window.innerWidth; H = window.innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  size(); window.addEventListener('resize', size);
  const rnd = (a, b) => a + Math.random() * (b - a);
  function piece(float, init){
    return { x: rnd(0, W), y: init ? rnd(-H, 0) : (float ? rnd(-40, -10) : rnd(-H * 0.6, -10)),
      w: rnd(6, 11), h: rnd(8, 15), c: COLORS[(Math.random() * COLORS.length) | 0],
      vy: float ? rnd(0.5, 1.2) : rnd(2.2, 4.5), vx: rnd(-0.8, 0.8), r: rnd(0, Math.PI * 2), vr: rnd(-0.08, 0.08),
      sw: rnd(0, Math.PI * 2), float: float, round: Math.random() < 0.3 };
  }
  const rain = Array.from({ length: 130 }, () => piece(false));
  const floaters = Array.from({ length: 60 }, () => piece(true, true));
  function draw(p){
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2.2, 0, Math.PI * 2); ctx.fill(); }
    else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.5)) + 2);
    ctx.restore();
  }
  if (reduce) {
    floaters.forEach(p => { p.y = rnd(0, H); ctx.globalAlpha = 0.7; draw(p); });
    return;
  }
  const start = performance.now();
  function frame(now){
    ctx.clearRect(0, 0, W, H);
    const t = now - start;
    if (t < 6000) {
      rain.forEach(p => { p.sw += 0.05; p.x += p.vx + Math.sin(p.sw) * 0.6; p.y += p.vy; p.r += p.vr; if (p.y < H + 20) draw(p); });
    }
    ctx.globalAlpha = 0.75;
    floaters.forEach(p => {
      p.sw += 0.02; p.x += p.vx * 0.4 + Math.sin(p.sw) * 0.4; p.y += p.vy; p.r += p.vr * 0.6;
      if (p.y > H + 20) Object.assign(p, piece(true));
      draw(p);
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
